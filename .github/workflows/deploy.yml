name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set this repo variable after deploying relay/ (see relay/README.md).
          # Without it, shared sessions show "no relay configured".
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
          # Optional shared secret; must match the relay's RELAY_TOKEN secret.
          # Kept as a repo *secret* (not a var) so it doesn't show in the Actions UI,
          # though it still ends up in the public built JS bundle like the URL above.
          VITE_RELAY_TOKEN: ${{ secrets.VITE_RELAY_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
